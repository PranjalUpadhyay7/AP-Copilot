[project]
name = "ap-copilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.10.17",
    "openai>=2.54.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "pymavlink>=2.4.49",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.1",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mutmut]
# Mutation-test only the Validation Layer (the safety-critical module); mutmut is slow.
source_paths = ["app/validation"]
# Copy app.models unmutated into mutmut's sandbox so imports resolve.
also_copy = ["app/__init__.py", "app/models"]
pytest_add_cli_args_test_selection = ["tests/unit/test_validators.py", "tests/unit/test_validators_properties.py", "tests/unit/test_dependency_rules.py", "tests/unit/test_criticality.py", "tests/unit/test_safety_snapshot.py"]
